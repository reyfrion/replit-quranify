kind = "web"
previewPath = "/"
title = "Quranify"
version = "1.0.0"
id = "artifacts/quranify"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20614

[services.development]
run = "pnpm --filter @workspace/quranify run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/quranify", "run", "build" ]
publicDir = "artifacts/quranify/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20614"
BASE_PATH = "/"
